<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#163b31">
    <title>微信登录 · Product Visual Studio</title>
    <style>
      :root { color-scheme: light; font-family: "Microsoft YaHei", system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-width: 320px; min-height: 100svh; color: #17342b;
        background: linear-gradient(155deg, #edf7f1 0%, #f7f4ef 55%, #fff 100%);
      }
      main {
        min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between;
        width: min(100%, 480px); margin: 0 auto;
        padding: max(56px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom));
      }
      .hero { padding-top: 8vh; }
      .mark {
        width: 68px; height: 68px; display: grid; place-items: center; margin-bottom: 28px;
        color: #fff; background: #176b52; border-radius: 22px; box-shadow: 0 14px 34px #176b5240;
        font: 34px Georgia, serif;
      }
      h1 { margin: 0; font-size: clamp(30px, 9vw, 40px); line-height: 1.16; letter-spacing: -.04em; }
      .lead { margin: 18px 0 0; color: #66766f; font-size: 15px; line-height: 1.8; }
      .features { display: grid; gap: 13px; margin: 36px 0; padding: 0; list-style: none; color: #465b53; font-size: 14px; }
      .features li { display: flex; align-items: center; gap: 11px; }
      .features span { width: 22px; height: 22px; display: grid; place-items: center; color: #176b52; background: #dcefe6; border-radius: 50%; font-weight: 800; }
      .login-card { padding: 20px; background: #ffffffd9; border: 1px solid #d9e5de; border-radius: 22px; box-shadow: 0 18px 50px #18382c12; backdrop-filter: blur(12px); }
      .wechat-button {
        min-height: 54px; display: flex; align-items: center; justify-content: center; gap: 10px;
        color: #fff; background: #07c160; border-radius: 14px; font-size: 17px; font-weight: 700;
        text-decoration: none; -webkit-tap-highlight-color: transparent;
      }
      .wechat-button:active { transform: scale(.99); background: #06ad56; }
      .wechat-icon { width: 28px; height: 28px; display: grid; place-items: center; background: #fff; color: #07c160; border-radius: 50%; font-size: 16px; }
      .hint { margin: 13px 2px 0; color: #849089; font-size: 12px; line-height: 1.6; text-align: center; }
      .error { margin: 0 0 12px; padding: 10px 12px; color: #a53e35; background: #fff1ef; border-radius: 10px; font-size: 13px; }
      [hidden] { display: none !important; }
      @media (min-width: 600px) { main { justify-content: center; gap: 40px; } .hero { padding-top: 0; } }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <div class="mark">P</div>
        <h1>商品视觉创作，<br>在手机上轻松完成</h1>
        <p class="lead">上传一张商品图，自动生成适合展示与分享的商品信息长图。</p>
        <ul class="features">
          <li><span>✓</span>微信身份自动识别，无需注册账号</li>
          <li><span>✓</span>图片、任务与生成结果仅自己可见</li>
        </ul>
      </section>
      <section class="login-card" aria-label="微信登录">
        <p id="loginError" class="error" role="alert" hidden></p>
        <a id="wechatLogin" class="wechat-button" href="/api/auth/wechat/start">
          <span class="wechat-icon">●</span>
          微信授权登录
        </a>
        <p class="hint">登录即表示你同意使用微信 OpenID 作为唯一身份标识。系统不会保存微信密码。</p>
      </section>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const next = params.get("next");
      if (["/app", "/profile", "/pay"].includes(next)) {
        document.getElementById("wechatLogin").href = `/api/auth/wechat/start?next=${encodeURIComponent(next)}`;
      }
      const error = params.get("error");
      if (error) {
        const box = document.getElementById("loginError");
        box.textContent = error;
        box.hidden = false;
      }
    </script>
  </body>
</html>
