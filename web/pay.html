<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173b30"><title>账户充值 · Product Visual Studio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100svh;font-family:"Microsoft YaHei",system-ui,sans-serif;color:#17342b;background:linear-gradient(145deg,#e8f2ec,#faf7f0 64%,#fff)}
    main{width:min(100%,640px);margin:auto;padding:36px 20px 60px}.back{color:#547067;text-decoration:none;font-size:13px}.card{margin-top:20px;padding:30px;background:#fffffff2;border:1px solid #d6e1da;border-radius:24px;box-shadow:0 22px 60px #173b3014}.kicker{color:#18805f;font-size:11px;font-weight:800;letter-spacing:.14em}h1{margin:12px 0 7px;font:36px Georgia,"Microsoft YaHei",serif}.lead{margin:0;color:#6a7771;font-size:14px;line-height:1.7}.balance{margin:24px 0;padding:16px 18px;display:flex;justify-content:space-between;background:#f0f6f2;border-radius:14px;font-size:13px}.packages{display:grid;grid-template-columns:1fr 1fr;gap:10px}.package{padding:18px;text-align:left;color:#17342b;background:#fff;border:1px solid #cad7d0;border-radius:14px;cursor:pointer}.package.selected{color:#fff;background:#176b52;border-color:#176b52}.package strong{display:block;font:27px Georgia,serif}.package span{display:block;margin-top:5px;font-size:12px;opacity:.76}.qr{display:none;margin:20px 0;text-align:center}.qr.visible{display:block}.qr img{width:240px;height:240px;padding:8px;background:#fff;border:1px solid #d9e5de;border-radius:14px}.qr p,.message{color:#64736c;font-size:13px;text-align:center}.message.error{color:#a53e35}.pay{width:100%;min-height:54px;margin-top:20px;color:#fff;background:#07a95a;border:0;border-radius:14px;font:inherit;font-size:16px;font-weight:750}.pay:disabled{opacity:.55}@media(max-width:480px){.card{padding:24px 18px}.packages{grid-template-columns:1fr}h1{font-size:31px}}
  </style>
</head>
<body><main>
  <a id="backLink" class="back" href="/profile">← 返回个人中心</a>
  <section class="card"><span class="kicker">ACCOUNT RECHARGE</span><h1>购买生成次数</h1><p class="lead">次数归属于当前微信 OpenID，可跨登录会话使用。每次成功生成扣除 1 次。</p>
    <div class="balance"><span>当前余额</span><strong id="balance">¥0.00 · 0 次</strong></div>
    <div id="packages" class="packages" aria-label="充值套餐"></div>
    <div id="qr" class="qr"><img id="qrImage" alt="微信支付二维码"><p>请使用手机微信扫码，支付完成后将自动刷新余额</p></div>
    <button id="pay" class="pay" disabled>选择套餐</button><p id="message" class="message">正在读取账户信息…</p>
  </section>
</main><script>
const payButton=document.getElementById('pay'),packagesNode=document.getElementById('packages'),message=document.getElementById('message'),balance=document.getElementById('balance'),qr=document.getElementById('qr'),qrImage=document.getElementById('qrImage'),backLink=document.getElementById('backLink');
const query=new URLSearchParams(location.search),returnTo=query.get('return_to')==='/app'?'/app':'/profile';if(returnTo==='/app'){backLink.href='/app';backLink.textContent='← 返回图片生成'}
const mobileWechat=/MicroMessenger/i.test(navigator.userAgent)&&/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);let selected='',createUrl='',paymentAttempt=0;
function note(text,error=false){message.textContent=text;message.classList.toggle('error',error)}
function clearQr(){qr.classList.remove('visible');qrImage.removeAttribute('src')}
async function load(){const response=await fetch('/api/payment/status',{cache:'no-store',credentials:'same-origin'});if(response.status===401){location.replace('/?next=%2Fpay');return}const data=await response.json();if(!response.ok)throw new Error(data.detail||'账户读取失败');createUrl=data.create_url;balance.textContent=`¥${(Number(data.balance_cent)/100).toFixed(2)} · ${data.remaining_uses} 次`;packagesNode.replaceChildren(...data.packages.map(item=>{const button=document.createElement('button');button.className='package';button.type='button';const price=document.createElement('strong');price.textContent=`¥${item.display_price}`;const detail=document.createElement('span');detail.textContent=`${item.description} · ${item.name}`;button.append(price,detail);button.onclick=()=>{const packageChanged=selected!==''&&selected!==item.id;selected=item.id;if(packageChanged){paymentAttempt+=1;clearQr()}document.querySelectorAll('.package').forEach(node=>node.classList.remove('selected'));button.classList.add('selected');payButton.disabled=false;payButton.textContent=mobileWechat?`微信支付 ¥${item.display_price}`:`生成 ¥${item.display_price} 微信支付二维码`;if(packageChanged)note('套餐已切换，请重新生成支付二维码')};return button}));const requested=new URLSearchParams(location.search).get('package');const index=data.packages.findIndex(item=>item.id===requested);if(index>=0)packagesNode.children[index].click();if(index<0)note('请选择充值套餐')}
function invoke(payment){return new Promise((resolve,reject)=>{const run=()=>WeixinJSBridge.invoke('getBrandWCPayRequest',payment,result=>result?.err_msg==='get_brand_wcpay_request:ok'?resolve():reject(new Error(result?.err_msg?.includes('cancel')?'支付已取消':'微信支付失败')));typeof WeixinJSBridge==='undefined'?document.addEventListener('WeixinJSBridgeReady',run,{once:true}):run()})}
async function waitPaid(orderNo,attempt,max=180){for(let i=0;i<max;i++){await new Promise(resolve=>setTimeout(resolve,2000));if(attempt!==paymentAttempt)return;const response=await fetch('/api/account',{cache:'no-store',credentials:'same-origin'});if(attempt!==paymentAttempt)return;if(response.status===401){location.replace('/?next=%2Fpay');return}if(response.ok){const data=await response.json();if(data.recharge_records.some(item=>item.order_id===orderNo)){location.replace(`${returnTo}?recharged=1`);return}}}throw new Error('支付结果仍在确认中，请稍后刷新')}
payButton.onclick=async()=>{if(!selected)return;const packageId=selected;const attempt=++paymentAttempt;payButton.disabled=true;clearQr();note('正在创建充值订单…');try{const authorizationResponse=await fetch('/api/payment/authorization',{method:'POST',cache:'no-store',credentials:'same-origin'});if(attempt!==paymentAttempt)return;if(authorizationResponse.status===401){location.replace('/?next=%2Fpay');return}const authorizationData=await authorizationResponse.json();if(!authorizationResponse.ok)throw new Error(authorizationData.detail||'无法创建支付授权');const response=await fetch(createUrl,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-Requested-With':'XMLHttpRequest'},body:JSON.stringify({payment_mode:mobileWechat?'jsapi':'native',package_id:packageId,authorization:authorizationData.authorization})});const data=await response.json();if(attempt!==paymentAttempt)return;if(response.status===401){location.replace('/?next=%2Fpay');return}if(!response.ok)throw new Error(`${data.detail||'创建订单失败'}${data.error_code?`（${data.error_code}）`:''}`);if(data.payment_mode==='native'){qrImage.src=data.qr_data_uri;qr.classList.add('visible');note('等待扫码支付…');await waitPaid(data.order_no,attempt,300)}else{await invoke(data.payment);if(attempt!==paymentAttempt)return;note('正在确认到账…');await waitPaid(data.order_no,attempt)}}catch(error){if(attempt!==paymentAttempt)return;payButton.disabled=false;note(error.message||'支付未完成',true)}};history.scrollRestoration='manual';window.addEventListener('pageshow',()=>window.scrollTo(0,0));load().catch(error=>note(error.message,true));
</script></body></html>
