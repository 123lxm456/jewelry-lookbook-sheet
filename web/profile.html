<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#18221d">
  <title>个人中心 · Product Visual Studio</title>
  <style>
    :root{--ink:#1d2521;--muted:#69736d;--line:#d8ddd8;--accent:#176b52;--surface:#fff;--canvas:#edf0ec;font-family:"Microsoft YaHei",system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-width:0;color:var(--ink);background:var(--canvas)}
    .profile-header{min-height:68px;padding:0 max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;color:#fff;background:#18221d}.profile-header a{min-height:44px;display:inline-flex;align-items:center;color:#dce8e1;text-decoration:none;font-size:13px}.shell{width:min(1100px,100%);margin:auto;padding:28px 20px 60px}
    .hero{padding:30px;display:grid;grid-template-columns:1fr auto;gap:24px;color:#fff;background:linear-gradient(125deg,#176b52,#143c30);border-radius:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;opacity:.7}.hero h1{margin:10px 0 7px;font:34px Georgia,"Microsoft YaHei",serif}.user-note{font-size:13px;opacity:.8}.money{text-align:right}.money strong{display:block;font:42px Georgia,serif}.money span{font-size:13px;opacity:.8}.actions{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}.actions a{min-height:42px;padding:0 15px;display:inline-flex;align-items:center;color:#17342b;background:#fff;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700}
    .stats{margin-top:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.panel{padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:14px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;margin-top:8px;font:28px Georgia,serif}.panel{margin-top:20px}.panel h2{margin:0 0 14px;font-size:16px}.profile-packages{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.profile-package{padding:14px;color:var(--ink);background:#f6f7f4;border:1px solid #e2e7e2;border-radius:10px;text-decoration:none}.profile-package strong,.profile-package span{display:block}.profile-package strong{font-size:14px}.profile-package span{margin-top:5px;color:var(--accent);font:22px Georgia,serif}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{min-height:40px;padding:0 14px;color:#56645d;background:#f2f4f1;border:0;border-radius:999px}.tabs button.active{color:#fff;background:var(--accent)}.records{margin-top:16px;display:grid;gap:10px}.empty{padding:32px;color:#83908a;text-align:center;font-size:13px}
    .record{padding:14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 14px;background:#f6f7f4;border:1px solid #e6e9e5;border-radius:10px;font-size:12px}.record strong{min-width:0;font-size:13px;overflow-wrap:anywhere}.record span{color:#6d7872;overflow-wrap:anywhere}.record-status{color:var(--accent)!important;font-weight:700}.generation-record{grid-template-columns:180px minmax(0,1fr) auto;grid-template-rows:auto auto auto}.history-preview{width:180px;grid-row:1/4;display:grid;grid-template-columns:repeat(3,1fr);gap:3px;overflow:hidden;color:#607069;background:#e5e9e5;border-radius:8px;text-align:center;text-decoration:none}.history-preview a{min-width:0;aspect-ratio:1;overflow:hidden;background:#dce2de}.history-preview a:last-child{grid-column:1/-1;aspect-ratio:3/2}.history-preview img{width:100%;height:100%;display:block;object-fit:cover;object-position:top}.history-preview-state{display:flex;align-items:center;justify-content:center;min-height:112px}.record-main{min-width:0;display:grid;gap:6px}.record-meta,.record-actions{display:flex;gap:8px;flex-wrap:wrap}.type-tag{padding:3px 7px;color:#315f4e!important;background:#e1eee7;border-radius:999px}.download-button{min-height:40px;padding:0 14px;border:0;display:inline-flex;align-items:center;align-self:center;justify-content:center;color:#fff;background:var(--accent);border-radius:8px;text-decoration:none;font:700 12px "Microsoft YaHei",sans-serif;white-space:nowrap;cursor:pointer}.secondary-button{color:#315f4e;background:#dfe9e3}
    @media(max-width:650px){.profile-header{min-height:62px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px}.shell{padding:16px 12px 40px}.hero{padding:22px 18px;grid-template-columns:1fr}.hero h1{font-size:29px}.money{text-align:left}.money strong{font-size:36px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.panel{padding:16px 12px}.profile-packages{grid-template-columns:1fr 1fr}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabs button{padding:0 7px;font-size:12px}.generation-record{grid-template-columns:116px minmax(0,1fr);grid-template-rows:auto auto}.history-preview{width:116px;grid-row:1/3}.download-button{grid-column:1/-1;width:100%;margin-top:4px}.record:not(.generation-record){grid-template-columns:1fr}.record:not(.generation-record)>:nth-child(even){text-align:left}}
  </style>
</head>
<body>
  <header class="profile-header"><strong>个人中心</strong><a href="/app">返回生成工作台 →</a></header>
  <main class="shell">
    <section class="hero">
      <div><span class="eyebrow">WECHAT ACCOUNT</span><h1>微信用户 <span id="openid">—</span></h1><div class="user-note">账户、订单与图片均按 OpenID 独立管理</div><div class="actions"><a href="/pay">立即充值</a><a href="/app">开始生成</a></div></div>
      <div class="money"><strong id="balance">¥0.00</strong><span id="uses">剩余 0 次</span></div>
    </section>
    <section class="stats"><div class="stat"><span>剩余生成次数</span><strong id="remaining">0</strong></div><div class="stat"><span>成功充值订单</span><strong id="recharges">0</strong></div><div class="stat"><span>历史成功生成</span><strong id="generated">0</strong></div></section>
    <section class="panel"><h2>充值套餐</h2><div id="packages" class="profile-packages"><div class="empty">正在加载…</div></div></section>
    <section class="panel"><h2>账户明细</h2><div class="tabs"><button data-view="generation" class="active">历史生成图片</button><button data-view="recharge">充值记录</button><button data-view="consumption">消费记录</button></div><div id="records" class="records"><div class="empty">正在加载…</div></div></section>
  </main>
  <script src="/download.js?v=20260813-5"></script>
  <script>
    const nodes={records:document.getElementById('records'),packages:document.getElementById('packages'),openid:document.getElementById('openid'),balance:document.getElementById('balance'),uses:document.getElementById('uses'),remaining:document.getElementById('remaining'),recharges:document.getElementById('recharges'),generated:document.getElementById('generated')};let account=null;
    const date=value=>value?new Date(value).toLocaleString('zh-CN'):'—';
    function element(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
    function empty(){nodes.records.replaceChildren(element('div','empty','暂无记录'))}
    const statusText={queued:'排队中',running:'生成中',completed:'已完成',failed:'生成失败'};
    async function cancelJob(jobId){if(!confirm('确定取消这个排队任务并释放预留额度吗？'))return;const response=await fetch(`/api/jobs/${encodeURIComponent(jobId)}/cancel`,{method:'POST',credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'取消失败');await load()}
    async function resumeJob(jobId){const response=await fetch(`/api/jobs/${encodeURIComponent(jobId)}/resume`,{method:'POST',credentials:'same-origin'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'恢复任务失败');location.href=`/app?job=${encodeURIComponent(jobId)}`}
    function renderGeneration(){const rows=account.generation_records;if(!rows.length){empty();return}nodes.records.replaceChildren(...rows.map(item=>{const row=element('article','record generation-record');let preview;if(item.status==='completed'){preview=element('div','history-preview');(item.images||[]).forEach(asset=>{const link=element('a');link.href=asset.url;link.target='_blank';link.rel='noopener';link.title=asset.label;const image=element('img');image.src=asset.url;image.loading='lazy';image.alt=asset.label;link.append(image);preview.append(link)})}else{preview=element('div','history-preview history-preview-state',item.status==='running'?`${item.progress||0}%`:(statusText[item.status]||'等待中'))}const main=element('div','record-main');main.append(element('strong','',item.product?.product_name||'商品视觉任务'));const meta=element('div','record-meta');const type=[item.product?.category_group,item.product?.subcategory].filter(Boolean).join(' · ')||'未分类商品';meta.append(element('span','type-tag',type),element('span','record-status',statusText[item.status]||item.status),element('span','',date(item.created_at)));main.append(meta,element('span','',item.stage||`任务 ID：${item.job_id}`));if(item.error&&item.status==='failed')main.append(element('span','',item.error));const actions=element('div','record-actions');if(item.status==='completed'){const download=element('a','download-button','下载全部图片');download.href=item.download_url;download.setAttribute('download','');window.ProductZipDownload.prepare(item.download_url,item.download_transfer_url,item.download_transfer_expires_in).catch(()=>{});download.addEventListener('click',async event=>{event.preventDefault();if(download.getAttribute('aria-disabled')==='true')return;const original=download.textContent;download.setAttribute('aria-disabled','true');download.textContent='正在打开系统选择器…';try{await window.ProductZipDownload.download(item.download_url,'product-images.zip')}catch(error){alert(error.message||'ZIP 下载失败，请稍后重试')}finally{download.setAttribute('aria-disabled','false');download.textContent=original}});actions.append(download)}else if(item.can_resume){const resume=element('button','download-button','继续生成');resume.type='button';resume.addEventListener('click',()=>{resume.disabled=true;resume.textContent='正在恢复…';resumeJob(item.job_id).catch(error=>{resume.disabled=false;resume.textContent='继续生成';alert(error.message)})});actions.append(resume)}else if(item.status==='queued'||item.status==='running'){const view=element('a','download-button','查看进度');view.href=`/app?job=${encodeURIComponent(item.job_id)}`;actions.append(view);if(item.status==='queued'){const cancel=element('button','download-button secondary-button','取消排队');cancel.type='button';cancel.addEventListener('click',()=>cancelJob(item.job_id).catch(error=>alert(error.message)));actions.append(cancel)}}row.append(preview,main,actions);return row}))}
    function renderRecharge(){const rows=account.recharge_records;if(!rows.length){empty();return}nodes.records.replaceChildren(...rows.map(item=>{const row=element('article','record');const packageText=item.package_name?`${item.package_name} · ${item.credits} 次`:'历史套餐';row.append(element('strong','',`${packageText} · ¥${(item.total_fee/100).toFixed(2)}`),element('span','record-status','支付成功'),element('span','',date(item.pay_time)),element('span','',`订单号：${item.order_id}`));return row}))}
    function renderConsumption(){const rows=account.consumption_records;if(!rows.length){empty();return}nodes.records.replaceChildren(...rows.map(item=>{const row=element('article','record');row.append(element('strong','',`生成服务 -¥${(item.amount_cent/100).toFixed(2)}`),element('span','record-status','扣费成功'),element('span','',date(item.completed_at)),element('span','',`任务 ID：${item.job_id}`));return row}))}
    function render(view){({generation:renderGeneration,recharge:renderRecharge,consumption:renderConsumption}[view]||renderGeneration)()}
    async function load(){const response=await fetch('/api/account',{cache:'no-store',credentials:'same-origin'});if(response.status===401){location.replace('/?next=%2Fprofile');return}account=await response.json();if(!response.ok)throw new Error(account.detail||'加载失败');nodes.openid.textContent=account.user.openid_masked;nodes.balance.textContent=`¥${(account.balance_cent/100).toFixed(2)}`;nodes.uses.textContent=`剩余 ${account.remaining_uses} 次`;nodes.remaining.textContent=account.remaining_uses;nodes.recharges.textContent=account.recharge_records.length;nodes.generated.textContent=account.generation_records.filter(item=>item.status==='completed').length;nodes.packages.replaceChildren(...account.packages.map(item=>{const link=element('a','profile-package');link.href=`/pay?package=${encodeURIComponent(item.id)}`;link.append(element('strong','',item.description),element('span','',`¥${item.display_price}`));return link}));render(document.querySelector('.tabs button.active')?.dataset.view||'generation')}
    document.querySelectorAll('.tabs button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tabs button').forEach(node=>node.classList.remove('active'));button.classList.add('active');render(button.dataset.view)}));
    const refresh=()=>load().catch(error=>nodes.records.replaceChildren(element('div','empty',error.message||'加载失败')));refresh();window.addEventListener('pageshow',refresh);document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});setInterval(()=>{if(!document.hidden&&account?.generation_records.some(item=>item.status==='queued'||item.status==='running'))refresh()},5000);
  </script>
</body>
</html>
